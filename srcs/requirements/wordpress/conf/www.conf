; @file www.conf
; @brief php-fpm pool configuration for the WordPress service.
; @note NGINX (a separate container) talks to this pool over the Docker
;       "inception" network, so it listens on a TCP port instead of a
;       Unix socket that only the local filesystem could reach.
[www]
user = www-data
group = www-data

; @brief Listen on TCP 9000, reachable from other containers on the network.
listen = 9000
listen.owner = www-data
listen.group = www-data

; @brief Dynamic process manager: spawns/kills PHP workers based on load.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; @brief Keep container environment variables visible to PHP scripts
;        (e.g. values injected via env_file in docker-compose.yml).
clear_env = no
